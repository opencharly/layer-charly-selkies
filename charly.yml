charly-selkies:
    candy:
        description: |-
            Metadata concept candy owning the charly-selkies skills whose names have no namesake candy (selkies desktop images). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the selkies concept candy's skill entities are present and generated into the marketplace's selkies/skills
              id: charly-selkies-present
              context:
                - build
              command: "true"

selkies-desktop-layer-skill:
    skill:
        name: selkies-desktop-layer
        family: selkies
        owner: charly-selkies
        description: |-
            Metalayer composing a full Selkies Wayland streaming desktop with Chrome, Waybar, desktop automation tools, and accessibility introspection.
            Use when working with the selkies-desktop metalayer composition, labwc desktop, or browser-accessible remote desktops.
wl-overlay-layer-skill:
    skill:
        name: wl-overlay-layer
        family: selkies
        owner: charly-selkies
        description: |-
            Wayland overlay windows via gtk4-layer-shell (for screen recordings).
            Use when working with the wl-overlay candy, gtk4-layer-shell, or overlay dependencies.
